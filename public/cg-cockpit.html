<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG 施策進行コックピット</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
  :root{
    --navy:#1E2D40; --blue:#2E6DA4; --blue2:#1A5276; --green:#117A65; --purple:#6C3483;
    --orange:#B9770E; --bg:#F4F6F8; --card:#fff; --line:#E1E5EA; --text:#1E2D40; --muted:#6B7785;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
  header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  header h1{font-size:16px;font-weight:600}
  header .meta{font-size:12px;color:#A9BBD0}
  .wrap{display:flex;max-width:1200px;margin:0 auto}
  nav{width:230px;flex-shrink:0;padding:18px 12px;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;margin-bottom:2px}
  nav button:hover{background:#E9EEF3}
  nav button.active{background:var(--blue);color:#fff;font-weight:600}
  nav .done{color:var(--green)}
  main{flex:1;padding:24px;min-width:0}
  .step{display:none}
  .step.active{display:block;animation:fade .2s}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  .step h2{font-size:20px;margin-bottom:4px}
  .step .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .card h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{min-height:64px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin:2px 4px 2px 0}
  .p-blue{background:#E6F1FB;color:#0C447C}.p-green{background:#D5F5E3;color:#0F6E56}
  .p-purple{background:#EEEDFE;color:#3C3489}.p-orange{background:#FBE7CF;color:#7A4E07}.p-gray{background:#ECEFF2;color:#5F6B78}
  pre{background:#1E2D40;color:#E6F1FB;padding:12px 14px;border-radius:8px;font-size:12px;overflow-x:auto;position:relative;font-family:ui-monospace,Menlo,monospace}
  .copy{position:absolute;top:8px;right:8px;background:#33445C;color:#fff;border:none;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer}
  .copy:hover{background:#46597a}
  .copy.ok{background:var(--green)}
  .tiers{display:grid;grid-template-columns:1fr;gap:8px}
  .tier{border-left:4px solid var(--blue);background:#F7FAFD;padding:10px 14px;border-radius:0 8px 8px 0}
  .tier.t15{border-color:var(--purple);background:#FAF8FE}
  .tier.t2{border-color:var(--green);background:#F4FBF8}
  .tier b{font-size:13px}.tier span{font-size:12px;color:var(--muted)}
  .axis{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
  .axis .pt{color:var(--muted)}
  .chk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;cursor:pointer}
  .chk input{width:auto}
  .note{background:#FFF8E6;border:1px solid #F0D98A;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#7A5B00;margin-top:10px}
  a.link{color:var(--blue);font-size:13px;text-decoration:none}a.link:hover{text-decoration:underline}
  .flowstep{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .flowstep .num{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .flowstep.star .num{background:var(--purple)}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
  .btn:hover{opacity:.9}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
  .progress div{height:100%;background:var(--green);transition:width .3s}
</style>
</head>
<body>
<div id="login" style="display:none;position:fixed;inset:0;background:#1E2D40;color:#fff;z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:18px">
  <div style="font-size:20px;font-weight:600">🚀 CG 施策進行コックピット</div>
  <div style="font-size:13px;color:#A9BBD0">許可されたメンバーのGoogleアカウントでログイン</div>
  <div id="gbtn"></div>
  <div id="loginerr" style="color:#F09595;font-size:13px"></div>
</div>
<header>
  <h1>🚀 CG 施策進行コックピット</h1>
  <span class="meta">マニュアルに沿って1ページで進行 ／ 入力は自動保存</span>
</header>
<div id="casebar" style="padding:6px 16px;background:#F4F7FB;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
let ID_TOKEN = sessionStorage.getItem("cg_idtoken") || "";
const API_BASE = (window.CG_CONFIG && window.CG_CONFIG.API_BASE) || "";

function showLogin(msg){
  document.getElementById("login").style.display="flex";
  if(msg) document.getElementById("loginerr").textContent=msg;
}
function hideLogin(){ document.getElementById("login").style.display="none"; }

window.onGoogleCredential=(resp)=>{
  ID_TOKEN=resp.credential;
  sessionStorage.setItem("cg_idtoken",ID_TOKEN);
  hideLogin();
};

function initAuth(){
  const cid = window.CG_CONFIG && window.CG_CONFIG.GOOGLE_CLIENT_ID;
  if(!cid){ hideLogin(); return; } // 未設定なら開発用に素通り
  if(ID_TOKEN){ hideLogin(); return; }
  showLogin();
  if(window.google && google.accounts){
    google.accounts.id.initialize({ client_id: cid, callback: window.onGoogleCredential });
    google.accounts.id.renderButton(document.getElementById("gbtn"), { theme:"filled_blue", size:"large" });
  }
}

  {id:"flow", t:"0. 全体フロー", sub:"発注から成果回収までの13ステップ。★が診断ツールの主戦場。"},
  {id:"hearing", t:"1. ヒアリング", sub:"ブランド・商品情報を取得（商品分析の入力になる）"},
  {id:"case", t:"案件", sub:"ブランド→商品→案件を登録し、現在の案件にセット"},
  {id:"product", t:"2. 商品分析", sub:"需要タイプ・肌悩み・訴求を抽出するプロンプト"},
  {id:"source", t:"3. 候補を探す", sub:"3パターン × 診断3層で候補リストを作る"},
  {id:"diagnose", t:"4. 診断する", sub:"スクリーニング／転換質（PR投稿のみ）／フル10軸"},
  {id:"prompts", t:"5. 診断プロンプト", sub:"インフルエンサー分析・マッチング診断をコピー"},
  {id:"record", t:"6. 記録する", sub:"提案ログDBに提案・採用・成果を貯める"},

  ["M01 商品カテゴリ適合","10"],["M02 需要・肌悩み適合","15"],["M03 投稿スタイル適合","10"],

function copyBtn(text){
  return `<button class="copy" onclick="cp(this)" data-t="${encodeURIComponent(text)}">コピー</button>`;
}
window.cp = (btn)=>{
  navigator.clipboard.writeText(decodeURIComponent(btn.dataset.t));
  btn.textContent="コピー済";btn.classList.add("ok");
  setTimeout(()=>{btn.textContent="コピー";btn.classList.remove("ok")},1500);
};

function field(id,label,ph,ta){
  const v = localStorage.getItem("cg_"+id)||"";
  const el = ta?`<textarea id="${id}" oninput="save('${id}',this.value)" placeholder="${ph}">${v}</textarea>`
               :`<input id="${id}" oninput="save('${id}',this.value)" placeholder="${ph}" value="${v.replace(/"/g,'&quot;')}">`;
  return `<label>${label}</label>${el}`;
}
window.save=(id,v)=>localStorage.setItem("cg_"+id,v);

async function api(path,body){
  let r;
  try{
    r=await fetch(API_BASE+path,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+ID_TOKEN},
      body:JSON.stringify(body)
    });
  }catch(e){
    throw new Error("通信エラー（リロードせず再実行してください）");
  }
  if(r.status===401){ showLogin("再ログインしてください"); throw new Error("未ログイン"); }
  if(r.status===403){ showLogin("このアカウントは許可リストにありません"); throw new Error("許可リスト外"); }
  try{ return await r.json(); }
  catch(e){ throw new Error("応答の解析に失敗（HTTP "+r.status+"）"); }
}

  let r;
  try{ r=await fetch(API_BASE+path,{ headers:{ "Authorization":"Bearer "+ID_TOKEN } }); }
  catch(e){ throw new Error("通信エラー（リロードせず再実行してください）"); }
  if(r.status===401){ showLogin("再ログインしてください"); throw new Error("未ログイン"); }
  if(r.status===403){ showLogin("このアカウントは許可リストにありません"); throw new Error("許可リスト外"); }
  try{ return await r.json(); }catch(e){ throw new Error("応答の解析に失敗（HTTP "+r.status+"）"); }
}

    headers:{ "Content-Type":"application/json","Authorization":"Bearer "+ID_TOKEN }, body:JSON.stringify(body) }); }

  try{ return await r.json(); }catch(e){ throw new Error("応答の解析に失敗（HTTP "+r.status+"）"); }
}

function parseTargets(text){
  return (text||"").split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function renderAnalyzeResult(elId, text){
  const el=document.getElementById(elId);
  el.innerHTML=`${copyBtn(text)}<pre style="white-space:pre-wrap">${escapeHtml(text)}</pre>`;
}

window.runProduct=async()=>{

window.runYTBatch=async()=>{
  const list=parseTargets(document.getElementById("ytin").value);
  const prOnly=document.getElementById("ytpr").checked;
  const el=document.getElementById("ytresult");
  const btn=document.getElementById("ytbtn");
  if(!list.length){el.innerHTML="<span style='color:#A32D2D'>チャンネルID/ハンドルを入力してください</span>";return;}
  btn.disabled=true; btn.textContent="実行中…";
  el.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12.5px">
    <thead><tr style="border-bottom:1px solid var(--line)">
      <th style="text-align:left;padding:6px 4px;width:34%">対象</th>
      <th style="text-align:left;padding:6px 4px">状態 / 結果</th></tr></thead>
    <tbody id="ytrows"></tbody></table>`;
  const tb=document.getElementById("ytrows");
  list.forEach((c,i)=>{
    const tr=document.createElement("tr");
    tr.style.borderBottom="1px solid var(--line)";
    tr.innerHTML=`<td style="padding:6px 4px;word-break:break-all">${c}</td><td id="ytcell${i}" style="padding:6px 4px;color:var(--muted)">待機中</td>`;
    tb.appendChild(tr);
  });
  let done=0;
  for(let i=0;i<list.length;i++){
    const cell=document.getElementById("ytcell"+i);
    cell.innerHTML="⏳ 実行中…（30〜60秒）"; cell.style.color="";
    try{
      const d=await api("/api/cockpit/youtube",{input:list[i],prOnly,caseId:caseId()});
      if(!d||!d.ok){ cell.innerHTML=`<span style="color:#A32D2D">エラー: ${(d&&d.error)||"失敗"}</span>`; }
      else{
        const badge=d.purchaseIntentRate>=15?"p-green":d.purchaseIntentRate>=5?"p-orange":"p-gray";
        cell.innerHTML=`<b>${d.title}</b> <span class="pill ${badge}">転換質${d.purchaseIntentRate}%</span><br>
          <span style="color:var(--muted);font-size:11.5px">登録${(d.subscribers||0).toLocaleString()} ／ ER${d.avgER}% ／ ${prOnly?"PR投稿":"人気投稿"}・${d.commentsAnalyzed}コメント</span>`;
        done++;
      }
    }catch(e){
      cell.innerHTML=`<span style="color:#A32D2D">${e.message||"失敗"}</span>`;
    }
  }
  btn.disabled=false; btn.textContent="一括診断";
  const note=document.createElement("div");
  note.className="note"; note.style.marginTop="10px";
  note.innerHTML=`✅ 完了：${done}/${list.length}件 成功。結果はスプレッドシート「診断ログ」にも保存されています。`;
  el.appendChild(note);
};

      <span style="color:var(--muted);font-size:12px">登録${r.subs.toLocaleString()} ／ ${r.contentType} ／ <a class="link" href="${r.url}" target="_blank">開く</a></span></div>`).join("");
  }catch(e){el.innerHTML=`<span style='color:#A32D2D'>${e.message||"失敗"}</span>`;}
};

        +`<td style="text-align:right;border-bottom:1px solid var(--line)">${x.intent==null?"—":x.intent+"%"}</td></tr>`).join("")

window.runIGBatch=async()=>{
  const list=parseTargets(document.getElementById("igin").value).map(s=>s.replace(/^@/,""));
  const prOnly=document.getElementById("igpr").checked;
  const el=document.getElementById("igresult");
  const btn=document.getElementById("igbtn");
  if(!list.length){el.innerHTML="<span style='color:#A32D2D'>ユーザー名を入力してください</span>";return;}
  btn.disabled=true; btn.textContent="実行中…";
  el.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12.5px">
    <thead><tr style="border-bottom:1px solid var(--line)">
      <th style="text-align:left;padding:6px 4px;width:34%">対象</th>
      <th style="text-align:left;padding:6px 4px">状態 / 結果</th></tr></thead>
    <tbody id="igrows"></tbody></table>`;
  const tb=document.getElementById("igrows");
  list.forEach((c,i)=>{
    const tr=document.createElement("tr");
    tr.style.borderBottom="1px solid var(--line)";
    tr.innerHTML=`<td style="padding:6px 4px;word-break:break-all">@${c}</td><td id="igcell${i}" style="padding:6px 4px;color:var(--muted)">待機中</td>`;
    tb.appendChild(tr);
  });
  for(let i=0;i<list.length;i++){
    const cell=document.getElementById("igcell"+i);
    cell.innerHTML="⏳ 実行中…（30〜60秒）"; cell.style.color="";
    try{
      const d=await api("/api/cockpit/instagram",{input:list[i],prOnly});
      const r=d&&d.results&&d.results[0];
      if(!d||!d.ok||!r){ cell.innerHTML=`<span style="color:#A32D2D">エラー: ${(d&&d.error)||"失敗"}</span>`; }
      else if(r.intent==null){ cell.innerHTML=`<span style="color:var(--muted)">取得不可（非公開/コメント無し）</span>`; }
      else{
        const badge=r.intent>=15?"p-green":r.intent>=5?"p-orange":"p-gray";
        cell.innerHTML=`<span class="pill ${badge}">転換質${r.intent}%</span>
          <span style="color:var(--muted);font-size:11.5px">（${prOnly?"PR投稿":"上位投稿"}・${r.commentsAnalyzed}コメント）</span>`;
      }
    }catch(e){ cell.innerHTML=`<span style="color:#A32D2D">${e.message||"失敗"}</span>`; }
  }
  btn.disabled=false; btn.textContent="一括診断（Apify）";
};

function readCsvFile(){
  const f=document.getElementById("ascsv").files[0];
  if(!f) return Promise.reject(new Error("CSVファイルを選択してください"));
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    rd.onload=()=>resolve(rd.result);
    rd.onerror=()=>reject(new Error("ファイル読込に失敗"));
    rd.readAsText(f);
  });
}

async function runCsvTool(path, render){
  const el=document.getElementById("ascsvresult");
  el.innerHTML="⏳ 処理中…";
  try{
    const csv=await readCsvFile();
    const d=await api(path,{csv});
    if(!d.ok){el.innerHTML=`<span style='color:#A32D2D'>エラー: ${d.error||"失敗"}</span>`;return;}
    el.innerHTML=render(d.rows||[]);
  }catch(e){el.innerHTML=`<span style='color:#A32D2D'>${e.message||"失敗"}</span>`;}
}

window.runIgProxy=()=>runCsvTool("/api/cockpit/ig-proxy", rows=>{
  if(!rows.length) return "対象なし";
  const head=`<div style="font-size:12px;color:var(--muted);margin-bottom:6px">IG転換質プロキシ（上位${Math.min(rows.length,20)}件・v0.1仮説）</div>`;
  const body=rows.slice(0,20).map((r,i)=>`<div style="padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px">
    ${i+1}. <b>@${r["アカウント名"]}</b> <span class="pill ${r["プロキシ点"]>=60?'p-green':r["プロキシ点"]>=45?'p-orange':'p-gray'}">${r["プロキシ点"]}点 ${r["判定"]}</span>
    <span style="color:var(--muted);font-size:11.5px">PRエンゲ${r["PRエンゲージ%"]||"—"} 実在${r["実在率%"]}%</span></div>`).join("");
  return head+body;
});

window.runAstreamIngest=()=>runCsvTool("/api/cockpit/astream-ingest", rows=>{

    ${i+1}. <b>@${r["インフルエンサー"]}</b> <span class="pill p-purple">暫定${r["暫定スコア(客層+実在+PR/45)"]}/45</span>
    <span style="color:var(--muted);font-size:11.5px">${(r["フォロワー"]||0).toLocaleString()}人 女性${r["女性%"]} 実在${r["実在率%"]} ${r["ジャンル推定"]}</span></div>`).join("");

});

let ACTIVE_CASE = localStorage.getItem("cg_active_case") || "";
function caseId(){ return ACTIVE_CASE; }
const CASE_STATUSES = ['受注','ヒアリング','候補リスト作成','クライアント選定待ち','起用交渉','制作進行','投稿済み','成果回収・完了','見送り・中止'];
function crm_status_options(){ return CASE_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join(""); }

async function renderCaseBar(){
  const bar=document.getElementById("casebar");
  let cases=[];
  try{ const r=await apiGet("/api/cockpit/cases"); if(r.ok) cases=r.cases||[]; }catch(e){}
  const opts=['<option value="">（現在の案件：未選択）</option>']
    .concat(cases.map(c=>`<option value="${c.case_id}" ${c.case_id===ACTIVE_CASE?"selected":""}>${escapeHtml(c.case_id+" "+c.name+"（"+c.status+"）")}</option>`));
  bar.innerHTML=`<b>現在の案件</b>
    <select id="activecase" onchange="setActiveCase(this.value)" style="max-width:60%">${opts.join("")}</select>
    <span style="color:var(--muted)">選択中は診断結果がこの案件に紐づきます</span>`;
}
window.setActiveCase=(v)=>{ ACTIVE_CASE=v||""; localStorage.setItem("cg_active_case",ACTIVE_CASE); };

async function fillBrandSelect(){
  const sel=document.getElementById("cs_brand"); if(!sel) return;
  try{ const r=await apiGet("/api/cockpit/brands"); if(r.ok){
    sel.innerHTML='<option value="">―</option>'+r.brands.map(b=>`<option value="${b.brand_id}">${escapeHtml(b.name)}</option>`).join("");
  }}catch(e){}
}
window.onBrandChange=async()=>{
  const bid=document.getElementById("cs_brand").value;
  const sel=document.getElementById("cs_product"); sel.innerHTML='<option value="">―</option>';
  if(!bid) return;
  try{ const r=await apiGet("/api/cockpit/products?brand_id="+encodeURIComponent(bid)); if(r.ok){
    sel.innerHTML='<option value="">―</option>'+r.products.map(p=>`<option value="${p.product_id}">${escapeHtml(p.name)}</option>`).join("");
  }}catch(e){}
};
window.createBrand=async()=>{
  const msg=document.getElementById("cs_brand_msg");
  const body={ name:(document.getElementById("cs_b_name").value||"").trim(),
    industry:(document.getElementById("cs_b_industry").value||"").trim(),
    contact:(document.getElementById("cs_b_contact").value||"").trim() };
  if(!body.name){ msg.innerHTML="<span style='color:#A32D2D'>ブランド名を入力してください</span>"; return; }
  try{ const r=await api("/api/cockpit/brands",body);
    if(r.ok){ msg.innerHTML="✅ 登録: "+r.brand_id; await fillBrandSelect(); document.getElementById("cs_brand").value=r.brand_id; onBrandChange(); }
    else msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(r.error)+"</span>";
  }catch(e){ msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(e.message)+"</span>"; }
};
window.createProduct=async()=>{
  const msg=document.getElementById("cs_product_msg");
  const brand_id=document.getElementById("cs_brand").value;
  if(!brand_id){ msg.innerHTML="<span style='color:#A32D2D'>先にブランドを選択してください</span>"; return; }
  const body={ brand_id, name:(document.getElementById("cs_p_name").value||"").trim(),
    category:(document.getElementById("cs_p_category").value||"").trim(),
    price:(document.getElementById("cs_p_price").value||"").trim(),
    url:(document.getElementById("cs_p_url").value||"").trim() };
  if(!body.name){ msg.innerHTML="<span style='color:#A32D2D'>商品名を入力してください</span>"; return; }
  try{ const r=await api("/api/cockpit/products",body);
    if(r.ok){ msg.innerHTML="✅ 登録: "+r.product_id; await onBrandChange(); document.getElementById("cs_product").value=r.product_id; }
    else msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(r.error)+"</span>";
  }catch(e){ msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(e.message)+"</span>"; }
};
window.createCase=async()=>{
  const msg=document.getElementById("cs_case_msg");
  const brand_id=document.getElementById("cs_brand").value;
  const product_id=document.getElementById("cs_product").value;
  if(!brand_id||!product_id){ msg.innerHTML="<span style='color:#A32D2D'>ブランドと商品を選択してください</span>"; return; }
  const body={ brand_id, product_id, name:(document.getElementById("cs_c_name").value||"").trim(),
    season:(document.getElementById("cs_c_season").value||"").trim(),
    budget:(document.getElementById("cs_c_budget").value||"").trim(),
    goal:(document.getElementById("cs_c_goal").value||"").trim() };
  if(!body.name){ msg.innerHTML="<span style='color:#A32D2D'>案件名を入力してください</span>"; return; }
  try{ const r=await api("/api/cockpit/cases",body);
    if(r.ok){ setActiveCase(r.case_id); msg.innerHTML="✅ 作成して現在の案件にセット: "+r.case_id; await renderCaseBar(); await loadCases(); }
    else msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(r.error)+"</span>";
  }catch(e){ msg.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(e.message)+"</span>"; }
};
window.loadCases=async()=>{
  const el=document.getElementById("cs_list"); if(!el) return;
  const f=document.getElementById("cs_filter"); const status=f?f.value:"";
  try{
    const r=await apiGet("/api/cockpit/cases"+(status?"?status="+encodeURIComponent(status):""));
    if(!r.ok){ el.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(r.error||"取得失敗")+"</span>"; return; }
    if(!r.cases.length){ el.innerHTML="<span style='color:var(--muted)'>案件がありません</span>"; return; }
    el.innerHTML=r.cases.map(c=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <b>${escapeHtml(c.case_id)}</b> ${escapeHtml(c.name)}
      <select onchange="updateCaseStatus('${c.case_id}',this.value)" style="font-size:12px">
        ${CASE_STATUSES.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}
      </select>
      <button class="btn" style="padding:2px 8px;font-size:11.5px" onclick="setActiveCase('${c.case_id}');renderCaseBar()">現在の案件に</button>
      <span style="color:var(--muted);font-size:11.5px">${escapeHtml(c.season||"")} ${escapeHtml(c.brand_id)}/${escapeHtml(c.product_id)}</span></div>`).join("");
  }catch(e){ el.innerHTML="<span style='color:#A32D2D'>"+escapeHtml(e.message)+"</span>"; }
};
window.updateCaseStatus=async(case_id,status)=>{
  try{ await apiPatch("/api/cockpit/cases",{case_id,status}); }catch(e){}
  await renderCaseBar();
};

let current="flow";
function render(){
  document.getElementById("nav").innerHTML = STEPS.map(s=>
    `<button class="${s.id===current?'active':''}" onclick="go('${s.id}')">${s.t}</button>`).join("");
  const s=STEPS.find(x=>x.id===current);
  document.getElementById("main").innerHTML =
    `<div class="step active"><h2>${s.t}</h2><div class="sub">${s.sub}</div>${RENDER[s.id]()}</div>`;
  updateBar();
}
window.go=(id)=>{current=id;render();window.scrollTo(0,0);
  if(id==="case"){ fillBrandSelect(); loadCases(); }
};
initAuth();
render();
renderCaseBar();
</script>
